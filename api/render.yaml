services:
  - type: web
    name: icu-prediction-api
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.0
      - key: ALLOW_ALL_ORIGINS
        value: true
      - key: FRONTEND_URL
        value: https://your-app.vercel.app

